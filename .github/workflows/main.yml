name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Test on (${{matrix.os}})
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cadiionogram
          environment-file: environment-build.yml
          auto-activate-base: false

      - name: Run tests
        shell: bash -l {0}
        run: |
          conda activate cadiionogram
          pytest

      - name: Build with pyinstaller
        shell: bash -l {0}
        run: |
          conda activate cadiionogram
          cd $GITHUB_WORKSPACE
          python -m PyInstaller main.spec

      - name: Prepare artifacts
        shell: bash -l {0}
        run: |
          mkdir dist-upload
          cp -r dist/* dist-upload/ || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{runner.os}}
          path: dist-upload/

      
  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch   # fallback if no feat/fix/breaking change
          tag_prefix: "v"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Rename artifacts
        run: |
          VERSION="${{ steps.tag_version.output.new_tag}}""
          echo "Using version: $VERSION"
          for dir in artifacts/*; do
            OS_TAG=$(basename "$dir" | sed 's/build-//')
            for f in "$dir"/*; do
              base=$(basename "$f")
              mv "$f" "artifacts/${base%.*}-${VERSION}-${OS_TAG}.${base##*.}"
            done
          done
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
