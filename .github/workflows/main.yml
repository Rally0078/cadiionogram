name: CI/CD

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    name: Build and Test on (${{matrix.os}})
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Rust is required
        id: check_rust
        shell: bash
        run: |
          if grep -q "require_rust = True" tests/conftest.py; then
            echo "rust_required=true" >> $GITHUB_OUTPUT
            echo "Rust is required"
          else
            echo "rust_required=false" >> $GITHUB_OUTPUT
            echo "Rust is NOT required"
          fi

      - name: Set up Rust
        if: steps.check_rust.outputs.rust_required == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Rust extension
        if: steps.check_rust.outputs.rust_required == 'true'
        shell: bash
        run: |
          cd rust
          cargo test
          cargo build --release

      - name: Export Rust release folder
        if: steps.check_rust.outputs.rust_required == 'true'
        shell: bash
        run: |
          mkdir -p dist/rust
          cp -r rust/target/release/. dist/rust/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp rust/target/release/mdreader_rs.dll src/ionogramparser/mdreader_rs.pyd
          else
            cp rust/target/release/libmdreader_rs.so src/ionogramparser/mdreader_rs.so
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run tests
        shell: bash
        run: |
          uv run pytest

      - name: Build with pyinstaller
        shell: bash
        run: |
          uv run python -m PyInstaller main.spec

      - name: Build AppImage (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          mv linuxdeploy-plugin-appimage-x86_64.AppImage linuxdeploy-plugin-appimage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage

          mkdir -p AppDir/usr/bin
          cp -r dist/main/* AppDir/usr/bin/
          
          # Ensure icon and desktop file are in the root for linuxdeploy to find
          # and also provide them explicitly via flags.
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/egrliono --desktop-file egrliono.desktop --icon-file iigmlogo.png --output appimage

          # Move the generated AppImage to dist
          mv egrliono*.AppImage dist/

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir dist-upload
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            # For Linux, only upload the AppImage
            cp dist/*.AppImage dist-upload/
          else
            # For Windows, upload the folder (it will be zipped in the release step)
            cp -r dist/* dist-upload/ || true
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{runner.os}}
          path: dist-upload/

      
  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: release
          default_bump: patch   # fallback if no feat/fix/breaking change
          tag_prefix: "v"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Rename artifacts
        run: |
          VERSION="${{ steps.tag_version.outputs.new_tag }}"
          echo "Using version: $VERSION"
      
          mkdir renamed
      
          for dir in artifacts/*; do
            OS_TAG=$(basename "$dir" | sed 's/build-//')
      
            for f in "$dir"/*; do
              base=$(basename "$f")
      
              if [ -f "$f" ]; then
                # Single-file artifact
                mv "$f" "renamed/${base%.*}-${VERSION}-${OS_TAG}.${base##*.}"
              elif [ -d "$f" ]; then
                # Folder artifact → zip it
                zip -r "renamed/${base}-${VERSION}-${OS_TAG}.zip" "$f"
              fi
            done
          done
      
          # Move back into artifacts/ so release step picks them up
          rm -rf artifacts/*
          mv renamed/* artifacts/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
